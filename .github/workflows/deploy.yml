name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: VITE_ENABLE_DEMO=true npm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Publish direct demo entry point
        run: |
          mkdir -p dist/demo
          cp dist/index.html dist/demo/index.html

      - name: Publish direct logistics entry point
        run: |
          mkdir -p dist/logistics
          cp dist/index.html dist/logistics/index.html

      - name: Publish partner-facing direct entry points
        run: |
          for route in guide export-pro partenariat-pilote legal; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true


  verify:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Verify public partner routes
        run: |
          set -euo pipefail
          base="https://cvlad97.github.io/kopeagri-caraibes"
          for route in / /demo/ /logistics/ /guide/ /export-pro/ /partenariat-pilote/ /legal/; do
            code="$(curl --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/page -w '%{http_code}' "$base$route")"
            echo "$route -> $code"
            test "$code" = "200"
            grep -q 'id="root"' /tmp/page
          done
