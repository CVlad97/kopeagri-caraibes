<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>KopéAgri Caraïbes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <script>
      (function () {
        var base = '/kopeagri-caraibes/'
        var full = window.location.pathname + window.location.search + window.location.hash
        var pathOnly = full.indexOf(base) === 0 ? full.slice(base.length - 1) : full
        var target = base + '?p=' + encodeURIComponent(pathOnly)
        window.location.replace(target)
      })()
    </script>
  </body>
</html>
